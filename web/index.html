<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Elaris</title>
<style>
:root{font-family:system-ui,sans-serif;background:#10131a;color:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#171b26,#0b0d12);min-height:100vh}main{max-width:720px;margin:auto;padding:18px 16px 36px}button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;background:#2d3446;color:#fff;font-size:16px}button.primary{background:#6d4aff}.card{background:#1b202c;border:1px solid #303748;border-radius:18px;padding:18px;margin:12px 0}h1{font-size:34px;margin:8px 0}.muted{color:#aab1c1}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#2a3040;margin:3px;font-size:13px}.log{max-height:250px;overflow:auto;background:#0b0d12;border-radius:12px;padding:10px}.log p{margin:6px 0;padding-bottom:6px;border-bottom:1px solid #252a35}.ok{color:#8be6a0}
</style></head><body><main><div id="app"></div></main>
<script>
const KEY="elaris-web-save-v1";
const realms=["Thalorien","Maraveth","Avernia","Eldoria","Nharak","Valoria","Kharad","Sylvaris","Draken","Lunareth","Veyria","Ashkar","Eryndor"];
let state={screen:"menu",tick:0,hp:100,potions:2,chronicles:["Il mondo di Elaris attende Ryan Shadow."],combat:null,message:""};
const app=document.getElementById("app");
function render(){let h='<h1>ELARIS</h1><div class="muted">Prototipo Web • mondo persistente • tick '+state.tick+'</div>';if(state.message)h+='<div class="card"><span class="ok">'+state.message+'</span></div>';app.innerHTML=h;({menu,world,character,adventure,combat,chronicles,inventory})[state.screen]();}
function add(h){app.innerHTML+=h}
function save(){localStorage.setItem(KEY,JSON.stringify(state));state.message="Partita salvata.";render()}
function load(){let r=localStorage.getItem(KEY);if(!r){state.message="Nessun salvataggio presente.";render();return}try{state={...state,...JSON.parse(r),screen:"world",message:"Partita caricata."};render()}catch(e){state.message="Salvataggio non valido.";render()}}
function start(){state={screen:"world",tick:0,hp:100,potions:2,chronicles:["Il viaggio di Ryan Shadow ha inizio."],combat:null,message:""};render()}
function nav(s){state.screen=s;state.message="";render()}
function advance(){state.tick++;state.chronicles.push("T"+state.tick+" — Il tempo passa.")}
function log(t){state.chronicles.push("T"+state.tick+" — "+t);state.message=t;render()}
function beginCombat(){state.combat={enemyHp:60,enemyName:"Predone",turn:0};nav("combat")}
function fight(){let c=state.combat;if(!c)return;let dmg=Math.floor(22+Math.random()*19),enemy=Math.floor(7+Math.random()*9);c.enemyHp=Math.max(0,c.enemyHp-dmg);c.turn++;if(c.enemyHp<=0){advance();state.combat=null;state.chronicles.push("T"+state.tick+" — Ryan Shadow ha sconfitto il predone.");state.screen="adventure";state.message="Combattimento vinto.";render();return}state.hp=Math.max(0,state.hp-enemy);if(state.hp<=0){state.hp=1;state.combat=null;state.screen="adventure";state.message="Ryan si ritira ferito.";state.chronicles.push("T"+state.tick+" — Ryan è stato ferito e si è ritirato.");}render()}
function heal(){if(state.potions>0&&state.hp<100){state.potions--;state.hp=Math.min(100,state.hp+35);state.message="Pozione utilizzata."}else state.message="Nessuna pozione utilizzabile.";render()}
function menu(){add('<div class="card"><h2>Benvenuto in Elaris</h2><p class="muted">Prima versione giocabile: Ryan, mondo, avventura, combattimento, cronache e salvataggio.</p><button class="primary" onclick="start()">START</button><button onclick="load()">CARICA PARTITA</button><button onclick="save()">SALVA PARTITA</button></div><div class="card"><b>Test consigliato</b><p>START → Avventura → Combattimento → Cronache → Salva → ricarica.</p></div>')}
function world(){add('<div class="card"><h2>Mondo</h2><p>Ryan Shadow si trova a Thalorien.</p>'+realms.map(function(r){return '<span class="badge">'+r+'</span>'}).join("")+'</div><div class="card"><button class="primary" onclick="nav(\'character\')">PERSONAGGIO</button><button onclick="nav(\'adventure\')">AVVENTURA</button><button onclick="nav(\'chronicles\')">CRONACHE</button><button onclick="nav(\'inventory\')">INVENTARIO</button><button onclick="save()">SALVA PARTITA</button><button onclick="nav(\'menu\')">MENU</button></div>')}
function character(){add('<div class="card"><h2>Ryan Shadow</h2><p><b>Ruolo:</b> Protagonista</p><p><b>Potere:</b> NON QUANTIFICABILE</p><p><b>Regno:</b> Thalorien</p><p><b>PV:</b> '+state.hp+'/100</p><p>Il giocatore controlla Ryan; il mondo controlla gli altri personaggi.</p></div><div class="card"><button onclick="nav(\'world\')">MONDO</button><button onclick="nav(\'adventure\')">AVVENTURA</button></div>')}
function adventure(){add('<div class="card"><h2>Avventura</h2><p>Una pattuglia attraversa una strada isolata di Thalorien. Un predone esce dalla boscaglia.</p><button class="primary" onclick="beginCombat()">AFFRONTA IL PREDONE</button><button onclick="advance();log(\'Ryan osserva la strada e prosegue.\')">PROSEGUI</button></div><div class="card"><button onclick="nav(\'world\')">MONDO</button></div>')}
function combat(){let c=state.combat;if(!c){nav("adventure");return}add('<div class="card"><h2>Combattimento</h2><p>Ryan Shadow <b>'+state.hp+' PV</b> vs '+c.enemyName+' <b>'+c.enemyHp+' PV</b></p><button class="primary" onclick="fight()">COMBATTI</button><button onclick="heal()">USA POZIONE ('+state.potions+')</button><p class="muted">Turno '+c.turn+'. Lo scontro ha terminazione garantita.</p></div>')}
function chronicles(){add('<div class="card"><h2>Cronache</h2><div class="log">'+state.chronicles.slice().reverse().map(function(x){return '<p>'+x+'</p>'}).join("")+'</div></div><div class="card"><button onclick="nav(\'world\')">MONDO</button></div>')}
function inventory(){add('<div class="card"><h2>Inventario</h2><p>• Pozione di cura: <b>'+state.potions+'</b></p><p class="muted">Inventario minimale del prototipo.</p></div><div class="card"><button onclick="heal()">USA POZIONE</button><button onclick="nav(\'world\')">MONDO</button></div>')}
render();
</script></body></html>
